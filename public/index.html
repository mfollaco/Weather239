<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="Current conditions and local radar for Irondequoit, New York."><title>Weather239</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQzA5A8dA8B9iYyL7rQZovv8/8fP7Zs=" crossorigin=""><link rel="stylesheet" href="/style.css"></head>
<body><main>
  <header><div><p class="eyebrow">IRONDEQUOIT, NY · KNYIROND36</p><h1>Weather239</h1></div><button id="refresh" aria-label="Refresh weather">↻</button></header>
  <p id="status" class="status">Loading backyard conditions…</p>
  <section id="alerts" class="alerts" hidden></section>
  <section class="hero card"><div><p id="condition" class="condition">—</p><div class="temp"><span id="temp">—</span><sup>°F</sup></div><p id="feels">Feels like —</p></div><div class="freshness"><span>●</span><span id="fresh">—</span></div></section>
  <section class="metrics card"><div><span>Humidity</span><strong id="humidity">—</strong></div><div><span>Dew point</span><strong id="dew">—</strong></div><div><span>Wind</span><strong id="wind">—</strong></div><div><span>Gust</span><strong id="gust">—</strong></div><div><span>Pressure</span><strong id="pressure">—</strong></div><div><span>Rain today</span><strong id="rain">—</strong></div></section>
  <section><div class="section-title"><h2>Next 24 hours</h2><span>Forecast</span></div><div id="hourly" class="hourly"></div></section>
  <section class="radar-section" aria-labelledby="radar-heading"><div class="section-title"><div><h2 id="radar-heading">Radar</h2><span id="radar-subtitle">Recent precipitation</span></div><button id="radar-fullscreen" class="radar-fullscreen" type="button" aria-label="View radar larger" title="View radar larger">⛶</button></div><div id="radar-card" class="radar-card card"><div id="radar-map" aria-label="Interactive precipitation radar centered on the Weather239 station"></div><div class="radar-controls"><button id="radar-play" type="button" aria-label="Play radar animation">▶</button><input id="radar-timeline" type="range" min="0" max="0" value="0" aria-label="Radar time"><output id="radar-time" for="radar-timeline">Loading radar…</output></div><p class="radar-attribution">Radar data by <a href="https://www.rainviewer.com/" target="_blank" rel="noopener noreferrer">RainViewer</a> · Pan and zoom to explore</p></div></section>
  <section><div class="section-title"><h2>7-day outlook</h2><span>Forecast</span></div><div id="daily" class="daily card"></div></section>
</main><template id="alert"><article><b></b><p></p></article></template><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="/app.js"></script></body></html>
